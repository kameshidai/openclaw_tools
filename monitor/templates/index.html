<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Monitor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="dashboard">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🦊</span>
                <span class="logo-text">OpenClaw</span>
            </div>
            <div class="version-badge" id="version">v?.?.?</div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span class="status-text">运行中</span>
            </div>
        </div>
        <div class="header-right">
            <div class="time-display" id="timeDisplay">
                <span class="time">--:--:--</span>
                <span class="date">----年--月--日</span>
            </div>
            <button class="btn-icon" id="themeToggle" title="切换主题">
                <span class="icon" id="themeIcon">🌙</span>
            </button>
            <button class="btn-icon btn-danger" id="restartBtn" title="重启 OpenClaw">
                <span class="icon">🔄</span>
            </button>
            <button class="btn-icon" id="logoutBtn" title="退出登录">
                <span class="icon">🚪</span>
            </button>
        </div>
    </header>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Agents Section -->
        <section class="agents-section">
            <div class="section-header">
                <h2>🤖 智能体状态</h2>
                <span class="refresh-info">每 10 分钟自动刷新</span>
            </div>
            <div class="agents-grid" id="agentsGrid">
                <!-- Agent cards will be loaded here -->
                <div class="agent-card skeleton"></div>
                <div class="agent-card skeleton"></div>
                <div class="agent-card skeleton"></div>
            </div>
        </section>
    </main>

    <!-- Footer Metrics -->
    <footer class="footer">
        <div class="metrics-bar">
            <div class="metric-item">
                <span class="metric-icon">💻</span>
                <div class="metric-info">
                    <span class="metric-label">CPU</span>
                    <span class="metric-value" id="cpuMetric">--%</span>
                </div>
            </div>
            <div class="metric-item">
                <span class="metric-icon">🧠</span>
                <div class="metric-info">
                    <span class="metric-label">内存</span>
                    <span class="metric-value" id="memMetric">-- MB</span>
                </div>
            </div>
            <div class="metric-item">
                <span class="metric-icon">💾</span>
                <div class="metric-info">
                    <span class="metric-label">磁盘</span>
                    <span class="metric-value" id="diskMetric">--%</span>
                </div>
            </div>
            <div class="metric-item">
                <span class="metric-icon">⏱️</span>
                <div class="metric-info">
                    <span class="metric-label">运行时间</span>
                    <span class="metric-value" id="uptimeMetric">--</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Restart Confirm Modal -->
    <div class="modal-overlay" id="restartModal" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚠️ 重启确认</h3>
            </div>
            <div class="modal-body">
                <p>确定要重启 OpenClaw Gateway 吗？</p>
                <p class="warning-text">此操作将中断当前运行的所有服务。</p>
                <div class="form-group">
                    <label>请输入 <code>checkok</code> 确认:</label>
                    <input type="text" id="confirmInput" placeholder="输入 checkok" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelRestart">取消</button>
                <button class="btn-danger" id="confirmRestart" disabled>确认重启</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
